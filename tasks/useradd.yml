- name: Include OS specific vars
  include_vars: "{{ ansible_os_family }}.yml"

- name: Manage OS users
  user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(admin_user_group) }}"
    state: "{{ item.state | default('present') }}"
    shell: /bin/bash
  loop: "{{ users }}"

- name: Add authorized ssh keys
  authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('file', ssh_keys_dir + '/' + item.name + '.pub') }}"
  when: 
    - ( item.state is defined and item.state != 'absent' ) or ( item.state is not defined )
    - lookup('file', ssh_keys_dir + '/' + item.name + '.pub', errors='ignore')
  loop: "{{ users }}"
  ignore_errors: '{{ ansible_check_mode }}'

- name: Allow admin users execute sudo without a password
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: "^%{{ admin_user_group }}"
    line: "%{{ admin_user_group }} ALL=(ALL) NOPASSWD: ALL"
  ignore_errors: '{{ ansible_check_mode }}'
