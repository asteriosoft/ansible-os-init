---
- name: Update apt-get repo and cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
    force_apt_get: yes

- name: Upgrade all packages to the latest versions
  apt:
    name: '*'
    state: latest
    force_apt_get: yes

- name: Install default packeges
  apt:
    name: '{{ debian_default_packeges }}'
    state: present

- name: Install custom packeges
  apt:
    name: '{{ debian_custom_packeges }}'
    state: present

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if required
  reboot:
    reboot_timeout: 600
  when: reboot_required.stat.exists or timezone.changed
  ignore_errors: '{{ ansible_check_mode }}'

- name: Remove dependencies that are no longer required
  apt:
    autoremove: yes
