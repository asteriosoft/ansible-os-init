---
- name: Set timezone to {{ timezone }}
  timezone:
    name: '{{ timezone }}'
  register: timezone

- name: Include OS specific tasks
  include_tasks: '{{ ansible_os_family }}.yml'
  tags: packages

- name: Create partitions for attached disks
  include_tasks:
    file: partitions.yml
  loop: '{{ partitions }}'
  when: (partitions is defined)

- name: Create and mount file systems
  include_tasks:
    file: mount.yml
  loop: '{{ mount }}'
  when: (mount is defined)

- name: Add mappings to /etc/hosts
  blockinfile:
    path: /etc/hosts
    block: |
      {{ item.ip }} {{ item.name }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item.name }}"
  loop: '{{ hostnames }}'

- name: Create users
  import_tasks:
    file: useradd.yml
  tags: useradd