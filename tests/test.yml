---
- hosts: localhost

  vars:
    timezone: 'Etc/UTC'
    debian_custom_packages:
      - openjdk-21-jdk
      - maven
    partitions:
      - device: "/dev/nvme5n1"
        part_number: 1
        part_end: "50GiB"
        part_type: "primary"
      - device: "/dev/nvme5n1"
        part_number: 2
        part_start: "50GiB"
        part_end: "100GiB"
    partitions_check_on_boot: true
    mount:
      - device_name: /dev/nvme5n1p1
        mount_path: /opt/db-data
        mount_options: 'defaults,nofail'
        fs_type: xfs
    hostnames:
      - name: artifactory
        ip: '10.0.1.12'
    ssh_keys_dir: '../{{ playbook_dir }}/ssh-keys'
    users_add:
      - alex
      - john
    users_del:
      - bill

  roles:
    - { role: ../../os-init }
